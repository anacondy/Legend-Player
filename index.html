<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Legend Batch Suite - Advanced Media Player with Batch Processing, Format Conversion, and Multi-Device Support" />
    <meta name="theme-color" content="#3facd3" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Legend Player - Batch Media Suite</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      
      #root {
        width: 100%;
        min-height: 100vh;
      }

      /* Performance optimizations for 60fps */
      * {
        -webkit-transform: translateZ(0);
        transform: translateZ(0);
        will-change: auto;
      }

      /* GPU acceleration for animations */
      .animate-transform {
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        -webkit-perspective: 1000px;
        perspective: 1000px;
      }

      /* Responsive video container ratios */
      @media (min-aspect-ratio: 16/9) {
        .video-container-16-9 {
          aspect-ratio: 16 / 9;
        }
      }

      @media (min-aspect-ratio: 20/9) {
        .video-container-20-9 {
          aspect-ratio: 20 / 9;
        }
      }

      /* Optimize scrolling performance */
      * {
        -webkit-overflow-scrolling: touch;
      }

      /* Loading spinner */
      .loader {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 48px;
        height: 48px;
        border: 5px solid #3facd3;
        border-bottom-color: transparent;
        border-radius: 50%;
        animation: rotation 1s linear infinite;
        z-index: 9999;
      }

      @keyframes rotation {
        0% { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
      }

      #loading-screen {
        position: fixed;
        inset: 0;
        background: #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9998;
        transition: opacity 0.5s ease-out;
      }

      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loader"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
